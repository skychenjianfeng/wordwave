name: wordwave
description: "WordWave 词浪 - 考研/四六级/专八等多词库背单词 App（Flutter 版）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  just_audio: ^0.9.0
  flutter_tts: ^4.0.0
  sherpa_onnx: ^1.13.4
  path: ^1.9.0
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/dicts/
    - assets/data/syllables.json
    - assets/data/ipa.json
    - assets/data/audio-syllables.json
    - assets/data/articles.json
    - assets/tts/
