workflows:
  ios-unsigned:
    name: iOS 未签名构建（Codemagic）
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: 下载离线语音模型
        script: bash tools/fetch-tts-models.sh
      - name: 构建 iOS 并打包 ipa
        script: |
          cd mobile
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r wordwave-ios-unsigned.ipa Payload
    artifacts:
      - mobile/wordwave-ios-unsigned.ipa
